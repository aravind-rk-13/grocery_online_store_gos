name: e2e
# When automated tests run (see docs/automation/rules.md):
#   pull_request        -> P1 suite + locator lint (merge gate: make this check "required" in branch protection)
#   schedule (nightly)  -> P1 + P2
#   workflow_dispatch   -> QA Lead chooses environment, suite and CR ("Run workflow" button)
#   repository_dispatch -> "run-tests" sent by a staging deployment or a Jira Automation rule
on:
  pull_request:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, demo]
        default: staging
      suite:
        description: "Which tests"
        type: choice
        options: [p1, p1-p2, module, full]
        default: p1
      module:
        description: "Module marker when suite = module (e.g. verify_users)"
        required: false
      cr_key:
        description: "Jira CR key this run belongs to (e.g. GOS-20); names the Xray Test Execution"
        required: false
  repository_dispatch:
    types: [run-tests]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || github.event.client_payload.environment || 'staging' }}
    env:
      # Secrets and variables at JOB level so every step's `if:` can see them (fix: the Xray step never ran before)
      APP_URL: ${{ vars.APP_URL || 'https://groceryapp.uniqassosiates.com/admin' }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: GOS
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SUITE: ${{ inputs.suite || github.event.client_payload.suite || '' }}
      MODULE: ${{ inputs.module || github.event.client_payload.module || '' }}
      CR_KEY: ${{ inputs.cr_key || github.event.client_payload.cr_key || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Locator lint (no absolute XPath, no selectors in specs, XPath budget)
        run: python scripts/lint_locators.py --max-xpath 5

      - name: Select tests
        id: select
        run: |
          case "${{ github.event_name }}:$SUITE" in
            schedule:*)     MARK="regression_p1 or regression_p2" ;;
            *:p1-p2)        MARK="regression_p1 or regression_p2" ;;
            *:module)       MARK="${MODULE:-regression_p1}" ;;
            *:full)         MARK="" ;;
            *)              MARK="regression_p1" ;;
          esac
          echo "mark=$MARK" >> "$GITHUB_OUTPUT"
          echo "Selected: ${MARK:-all tests}"

      - name: Run tests
        run: |
          if [ -n "${{ steps.select.outputs.mark }}" ]; then
            python -m pytest -m "${{ steps.select.outputs.mark }}"
          else
            python -m pytest
          fi

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/

      - name: Import results to Xray
        if: always() && env.XRAY_CLIENT_ID != ''
        run: |
          SUMMARY=""
          if [ -n "$CR_KEY" ]; then SUMMARY="$CR_KEY | automated | $(date -u +'%Y-%m-%d %H:%M') | CI"; fi
          python scripts/xray_sync.py import-junit test-results/junit.xml "$SUMMARY"

      # Pass = silence, Fail = alert (only when a Slack/Teams incoming webhook is configured)
      - name: Failure alert
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"e2e FAILED (${SUITE:-${{ github.event_name }}}${CR_KEY:+, $CR_KEY}) by @${{ github.actor }}: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
