[pytest]
testpaths = tests
# xunit1 allows per-test <properties>, which carry the Xray test_key (see conftest._xray_test_key)
junit_family = xunit1
# 2 retries on failure (CODIFAi automation standard); tests that pass only on retry are reported as "rerun" -> quarantine per flaky policy
addopts = -ra --strict-markers --reruns 2 --reruns-delay 1 --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results --junitxml=test-results/junit.xml --html=test-results/report.html --self-contained-html
markers =
    regression_p1: smoke tier, runs on every pull request (CI gate); mirrors Jira label regression-p1
    regression_p2: core tier, runs nightly and before release; mirrors Jira label regression-p2
    regression_p3: extended tier, manual or scheduled; mirrors Jira label regression-p3
    functional_ui: coverage - happy path / core flow
    negative: coverage - invalid input or failure path
    boundary: coverage - limits, min/max
    edge: coverage - blank, whitespace, case, empty states
    security: coverage - injection and special characters
    session_state: coverage - auth, session, navigation state
    accessibility: coverage - keyboard / accessible names
    network: coverage - slow network, timeout, offline
    api: coverage - backend responses behind a screen
    data_persistence: coverage - data survives reload, not stored where it should not be
    login: module - admin login (Jira component Login)
    verify_users: module - Verify Users screen (Jira component Verify Users)
