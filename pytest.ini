[pytest]
testpaths = tests
# xunit1 allows per-test <properties>, which carry the Xray test_key (see conftest._xray_test_key)
junit_family = xunit1
# 2 retries on failure (CODIFAi automation standard); tests that pass only on retry are reported as "rerun" -> quarantine per flaky policy
# Report paths are set per run in conftest.pytest_configure: test-results/<YYYY-MM-DD_HH-MM-SS>/junit_<ts>.xml,
# report_<ts>.html and artifacts/ (traces, screenshots); test-results/latest.txt names the newest run. Nothing is overwritten.
# Timing log (pages/waits.py): START / END <step> in <n> ms, shown live and kept in the HTML report
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s.%(msecs)03d %(levelname)-7s %(message)s
log_cli_date_format = %H:%M:%S
log_format = %(asctime)s.%(msecs)03d %(levelname)-7s %(message)s
log_date_format = %H:%M:%S
log_level = INFO
addopts = -ra --strict-markers --reruns 2 --reruns-delay 1 --browser chromium --tracing retain-on-failure --screenshot only-on-failure
markers =
    regression_p1: smoke tier, run locally before every PR merge and after each staging deploy; mirrors Jira label regression-p1
    regression_p2: core tier, run before release; mirrors Jira label regression-p2
    regression_p3: extended tier, on demand; mirrors Jira label regression-p3
    functional_ui: coverage - happy path / core flow
    negative: coverage - invalid input or failure path
    boundary: coverage - limits, min/max
    edge: coverage - blank, whitespace, case, empty states
    security: coverage - injection and special characters
    session_state: coverage - auth, session, navigation state
    accessibility: coverage - keyboard / accessible names
    network: coverage - slow network, timeout, offline
    api: coverage - backend responses behind a screen
    data_persistence: coverage - data survives reload, not stored where it should not be
    login: module - admin login (Jira component Login)
    verify_users: module - Verify Users screen (Jira component Verify Users)
    admin_users: module - Admin Users screen and its sidebar entry (Jira component Admin Users)
    manage_product: module - Manage Product screen (product list, delete) and its sidebar entry (Jira component Manage Product)
